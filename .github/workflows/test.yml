name: test

# 官方定价页改版过一次（3 模型列 → 2 模型列 + 模型改名），当时解析器静默失败、
# 面板退回内置旧价，用户看到的价格是错的。0.2.2 又改了 session API 与
# composer 插槽：这个 workflow 让解析契约、账本 fold、Config/槽位 id 在每次
# 推送时被离线校验（fixtures 是真实页面存档 + 合成事件，不需要联网）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the official Config schema dependency
        run: npm install --no-audit --no-fund
      - name: Regression tests (pricing, host fold, Config/slot)
        run: npm test
